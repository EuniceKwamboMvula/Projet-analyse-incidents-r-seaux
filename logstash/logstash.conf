input {
file {
path => "/logs/*.log"
start_position => "beginning"
sincedb_path => "/dev/null"
}
tcp { port => 5000 }
}


filter {
# Exemple: parser générique, extraire timestamp, level, message, source
grok {
match => { "message" => "%{TIMESTAMP_ISO8601:ts} %{LOGLEVEL:level} %{GREEDYDATA:msg}" }
overwrite => ["message"]
}
date { match => ["ts", "ISO8601"] }
}


output {
elasticsearch { hosts => ["elasticsearch:9200"] index => "network-logs-%{+YYYY.MM.dd}" }
stdout { codec => rubydebug }
}